name: Build password-auth packages

on:
  push:
    branches: [feature-password-auth]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootful, rootless, roothide]
    env:
      THEOS: ${{ github.workspace }}/.ci-theos
      THEOS_PLATFORM_SDK_ROOT: /Applications/Xcode_16.4.app/Contents/Developer
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test password auth and Settings resources
        run: |
          xcrun clang -fobjc-arc -framework Foundation -framework Security tests/http_auth_tests.m -o "$RUNNER_TEMP/http-auth-tests"
          "$RUNNER_TEMP/http-auth-tests"
          python3 tests/prefs_localization_test.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: roothide/theos
          ref: 958fea4f779943505b15b93c88bb4db8d97b346d
          submodules: recursive
          path: .ci-theos
          persist-credentials: false
      - name: Prepare iOS build tools and SDK
        run: |
          brew install make ldid dpkg
          curl -fLsS --retry 3 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
          (cd "$RUNNER_TEMP" && echo '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  sdk.tar.xz' | shasum -a 256 -c -)
          tar -xf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
      - name: Build and verify installable package
        run: bash scripts/build_auth_package.sh "${{ matrix.scheme }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-mcp-password-auth-${{ matrix.scheme }}
          path: |
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
